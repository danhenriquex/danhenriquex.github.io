<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Portfolio</title>
  <meta name="description" content="Projects, automatically updated from GitHub.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="hero wrap" id="hero">
    <div class="hero-top">
      <img class="avatar" id="avatar" alt="" width="72" height="72">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1Z"/></svg>
      </button>
    </div>
    <h1 id="name">&nbsp;</h1>
    <p class="headline" id="headline"></p>
    <ul class="about" id="about"></ul>
    <div class="hero-meta">
      <span id="location"></span>
      <nav class="links" id="links"></nav>
    </div>
    <dl class="stats" id="stats"></dl>
  </header>

  <nav class="wrap tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" type="button" id="tabProjects" data-tab="projects" aria-controls="panelProjects" aria-selected="true">Projects</button>
    <button class="tab" role="tab" type="button" id="tabFrequency" data-tab="frequency" aria-controls="panelFrequency" aria-selected="false">Frequency</button>
  </nav>

  <main class="wrap">
   <div id="panelProjects" role="tabpanel" aria-labelledby="tabProjects">
    <section id="featuredSection" hidden>
      <h2 class="section-title">Featured</h2>
      <div class="grid featured" id="featured"></div>
    </section>

    <section>
      <div class="section-head">
        <h2 class="section-title">All projects</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.38A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
          <input id="search" type="search" placeholder="Search projects, stacks…" autocomplete="off">
        </label>
        <select id="stackFilter" aria-label="Filter by technology"><option value="">All technologies</option></select>
        <select id="sort" aria-label="Sort">
          <option value="featured">Featured first</option>
          <option value="updated">Recently updated</option>
          <option value="created">Newest</option>
          <option value="stars">Most stars</option>
          <option value="name">Name</option>
        </select>
      </div>
      <div class="chips" id="categories" role="tablist"></div>
      <div class="grid" id="projects"></div>
      <p class="empty" id="empty" hidden>No projects match your filters.</p>
    </section>
   </div>

   <div id="panelFrequency" role="tabpanel" aria-labelledby="tabFrequency" hidden>
    <div class="chips" id="freqCats" role="tablist" aria-label="Scope the charts by category"></div>

    <figure class="viz-card">
      <header class="viz-head">
        <div>
          <h2 class="viz-title">Technologies</h2>
          <p class="viz-sub">Share of <span class="freq-scope"></span> that use each technology. A project usually uses several, so the bars don't add up to 100%.</p>
        </div>
        <button class="viz-toggle" type="button" data-table-toggle="tech" aria-pressed="false">Table</button>
      </header>
      <div id="techChart"></div>
      <button class="viz-more" type="button" id="techMore" hidden></button>
    </figure>

    <div class="viz-row">
      <figure class="viz-card">
        <header class="viz-head">
          <div>
            <h2 class="viz-title">Primary language</h2>
            <p class="viz-sub">Main language of <span class="freq-scope"></span>, by code size in each repo.</p>
          </div>
          <button class="viz-toggle" type="button" data-table-toggle="lang" aria-pressed="false">Table</button>
        </header>
        <div id="langChart"></div>
      </figure>

      <figure class="viz-card">
        <header class="viz-head">
          <div>
            <h2 class="viz-title">Stack over time</h2>
            <p class="viz-sub">Projects started each year that use a technology, across <span class="freq-scope"></span>.</p>
          </div>
          <button class="viz-toggle" type="button" data-table-toggle="heat" aria-pressed="false">Table</button>
        </header>
        <div id="heatChart"></div>
      </figure>
    </div>
   </div>
  </main>

  <footer class="wrap footer">
    <span id="generated"></span>
    <span>Built automatically from <a id="ghLink" href="https://github.com">GitHub</a>.</span>
  </footer>

  <dialog id="dialog" aria-labelledby="dTitle">
    <article class="sheet">
      <header class="sheet-head">
        <div>
          <span class="cat" id="dCat"></span>
          <h2 id="dTitle"></h2>
          <p class="sheet-summary" id="dSummary"></p>
        </div>
        <button class="close" id="dClose" type="button" aria-label="Close">×</button>
      </header>
      <div class="sheet-links" id="dLinks"></div>
      <div class="tags" id="dStack"></div>
      <div class="langbar" id="dLangs"></div>
      <div class="readme" id="dReadme"></div>
    </article>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
