<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Portfolio</title>
  <meta name="description" content="AI agents, RAG pipelines, data engineering and web projects — updated automatically from GitHub.">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="topbar wrap">
      <span class="brand" id="brand">&nbsp;<span class="caret">_</span></span>
      <nav class="topnav" role="tablist" aria-label="Views">
        <button class="tab" role="tab" type="button" id="tabProjects" data-tab="projects" aria-controls="panelProjects" aria-selected="true">Projects</button>
        <button class="tab" role="tab" type="button" id="tabFrequency" data-tab="frequency" aria-controls="panelFrequency" aria-selected="false">Frequency</button>
        <span class="navlinks" id="navLinks"></span>
      </nav>
    </header>

    <main class="wrap">
      <section class="hero">
        <img class="avatar" id="avatar" alt="" width="88" height="88" hidden>
        <p class="eyebrow" id="headline">&nbsp;</p>
        <h1 id="name">&nbsp;</h1>
        <p class="tagline" id="tagline"></p>
        <div class="hero-cta" id="heroCta"></div>
      </section>

      <div id="panelProjects" role="tabpanel" aria-labelledby="tabProjects">
        <section id="featuredSection" class="block" hidden>
          <h2 class="label">Featured</h2>
          <div class="grid grid-3" id="featured"></div>
        </section>

        <section id="projectsSection" class="block">
          <div class="block-head">
            <h2 class="label">All projects · <span id="count"></span></h2>
            <div class="chips" id="categories" role="tablist" aria-label="Filter by category"></div>
          </div>
          <div class="toolbar">
            <label class="search">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.38A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
              <input id="search" type="search" placeholder="Search projects, stacks…" autocomplete="off">
            </label>
            <select id="stackFilter" aria-label="Filter by technology"><option value="">All technologies</option></select>
            <select id="sort" aria-label="Sort">
              <option value="featured">Featured first</option>
              <option value="updated">Recently updated</option>
              <option value="created">Newest</option>
              <option value="stars">Most stars</option>
              <option value="name">Name</option>
            </select>
          </div>
          <div class="grid grid-2" id="projects"></div>
          <p class="empty" id="empty" hidden>No projects match your filters.</p>
        </section>
      </div>

      <div id="panelFrequency" class="block" role="tabpanel" aria-labelledby="tabFrequency" hidden>
        <div class="block-head">
          <h2 class="label">Frequency</h2>
          <div class="chips" id="freqCats" role="tablist" aria-label="Scope the charts by category"></div>
        </div>

        <figure class="viz-card">
          <header class="viz-head">
            <div>
              <h3 class="viz-title">Technologies</h3>
              <p class="viz-sub">Share of <span class="freq-scope"></span> that use each technology. A project usually uses several, so the bars don't add up to 100%.</p>
            </div>
            <button class="viz-toggle" type="button" data-table-toggle="tech" aria-pressed="false">Table</button>
          </header>
          <div id="techChart"></div>
          <button class="viz-more" type="button" id="techMore" hidden></button>
        </figure>

        <div class="viz-row">
          <figure class="viz-card">
            <header class="viz-head">
              <div>
                <h3 class="viz-title">Primary language</h3>
                <p class="viz-sub">Main language of <span class="freq-scope"></span>, by code size in each repo.</p>
              </div>
              <button class="viz-toggle" type="button" data-table-toggle="lang" aria-pressed="false">Table</button>
            </header>
            <div id="langChart"></div>
          </figure>

          <figure class="viz-card">
            <header class="viz-head">
              <div>
                <h3 class="viz-title">Stack over time</h3>
                <p class="viz-sub">Projects started each year that use a technology, across <span class="freq-scope"></span>.</p>
              </div>
              <button class="viz-toggle" type="button" data-table-toggle="heat" aria-pressed="false">Table</button>
            </header>
            <div id="heatChart"></div>
          </figure>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span id="copyright"></span>
      <span class="sep">·</span>
      <span id="generated"></span>
    </footer>
  </div>

  <dialog id="dialog" aria-labelledby="dTitle">
    <article class="sheet">
      <header class="sheet-head">
        <div>
          <span class="cat" id="dCat"></span>
          <h2 id="dTitle"></h2>
          <p class="sheet-summary" id="dSummary"></p>
        </div>
        <button class="close" id="dClose" type="button" aria-label="Close">×</button>
      </header>
      <div class="sheet-links" id="dLinks"></div>
      <div class="tags" id="dStack"></div>
      <div id="dLangs"></div>
      <div class="readme" id="dReadme"></div>
    </article>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
